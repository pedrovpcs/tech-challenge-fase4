AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Feedback de aulas - tres funcoes independentes
Parameters:
  AdminEmail:
    Type: String
    NoEcho: true
    Description: Endereco autorizado; confirmar assinatura SNS apos deploy
  MonthlyBudgetUSD:
    Type: Number
    Default: 5
    MinValue: 1
Globals:
  Function:
    Runtime: java21
    CodeUri: target/feedback-1.0.0.jar
    MemorySize: 512
    Timeout: 30
    Environment:
      Variables:
        TABLE_NAME: !Ref Evaluations
Resources:
  Evaluations:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: id, AttributeType: S}
        - {AttributeName: week, AttributeType: S}
        - {AttributeName: sort, AttributeType: S}
      KeySchema:
        - {AttributeName: id, KeyType: HASH}
      GlobalSecondaryIndexes:
        - IndexName: ByWeek
          KeySchema:
            - {AttributeName: week, KeyType: HASH}
            - {AttributeName: sort, KeyType: RANGE}
          Projection: {ProjectionType: ALL}
      SSESpecification: {SSEEnabled: true}
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
      StreamSpecification: {StreamViewType: NEW_IMAGE}
  Notifications:
    Type: AWS::SNS::Topic
    Properties:
      Subscription:
        - Protocol: email
          Endpoint: !Ref AdminEmail
  NotificationsPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics: [!Ref Notifications]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowOnlyStackAlarms
            Effect: Allow
            Principal:
              Service: cloudwatch.amazonaws.com
            Action: sns:Publish
            Resource: !Ref Notifications
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnEquals:
                aws:SourceArn:
                  - !GetAtt ReceiveErrors.Arn
                  - !GetAtt CriticalErrors.Arn
                  - !GetAtt WeeklyErrors.Arn
                  - !GetAtt StreamAge.Arn
  Api:
    Type: AWS::Serverless::Api
    Properties:
      StageName: v1
      Auth:
        DefaultAuthorizer: AWS_IAM
      MethodSettings:
        - ResourcePath: '/*'
          HttpMethod: '*'
          MetricsEnabled: true
          ThrottlingBurstLimit: 10
          ThrottlingRateLimit: 5
          DataTraceEnabled: false
  Receive:
    Type: AWS::Serverless::Function
    Properties:
      Handler: br.com.fiap.feedback.handlers.ReceiveHandler::handleRequest
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:PutItem
              Resource: !GetAtt Evaluations.Arn
      Events:
        Post:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /avaliacao
            Method: post
  CriticalExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CriticalExecution
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: EvaluationNotificationState
                Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:UpdateItem]
                Resource: !GetAtt Evaluations.Arn
              - Sid: ReadEvaluationStream
                Effect: Allow
                Action: [dynamodb:DescribeStream, dynamodb:GetRecords, dynamodb:GetShardIterator]
                Resource: !GetAtt Evaluations.StreamArn
              # Required by Lambda stream consumption; ListStreams has no resource-level scope.
              - Sid: DiscoverStreams
                Effect: Allow
                Action: dynamodb:ListStreams
                Resource: '*'
              - Sid: PublishCriticalNotification
                Effect: Allow
                Action: sns:Publish
                Resource: !Ref Notifications
              - Sid: WriteCriticalLogs
                Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt CriticalLogs.Arn
  Critical:
    Type: AWS::Serverless::Function
    Properties:
      Handler: br.com.fiap.feedback.handlers.CriticalHandler::handleRequest
      Role: !GetAtt CriticalExecutionRole.Arn
      LoggingConfig:
        LogGroup: !Ref CriticalLogs
      Environment:
        Variables:
          TOPIC_ARN: !Ref Notifications
      Events:
        Insert:
          Type: DynamoDB
          Properties:
            Stream: !GetAtt Evaluations.StreamArn
            StartingPosition: TRIM_HORIZON
            BatchSize: 10
            ParallelizationFactor: 1
            FunctionResponseTypes: [ReportBatchItemFailures]
            BisectBatchOnFunctionError: true
            FilterCriteria:
              Filters:
                - Pattern: '{"eventName":["INSERT"],"dynamodb":{"NewImage":{"urgencia":{"S":["CRITICA"]}}}}'
  Weekly:
    Type: AWS::Serverless::Function
    Properties:
      Handler: br.com.fiap.feedback.handlers.WeeklyHandler::handleRequest
      Timeout: 120
      Environment:
        Variables:
          TOPIC_ARN: !Ref Notifications
          REPORT_ZONE: America/Sao_Paulo
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:Query
              Resource: !Sub '${Evaluations.Arn}/index/ByWeek'
            - Effect: Allow
              Action: sns:Publish
              Resource: !Ref Notifications
      Events:
        Monday:
          Type: Schedule
          Properties:
            Schedule: cron(0 12 ? * MON *)
            Description: Segunda 12h UTC; semana anterior no fuso Sao Paulo
            RetryPolicy:
              MaximumEventAgeInSeconds: 86400
              MaximumRetryAttempts: 2
  CostBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub '${AWS::StackName}-monthly'
        BudgetLimit: {Amount: !Ref MonthlyBudgetUSD, Unit: USD}
        TimeUnit: MONTHLY
        BudgetType: COST
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AdminEmail
  ReceiveLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${Receive}'
      RetentionInDays: 14
  ReceiveErrors:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Falhas da funcao Receive
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref Receive
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref Notifications]
  CriticalLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 14
  CriticalErrors:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Falhas da funcao Critical
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref Critical
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref Notifications]
  WeeklyLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${Weekly}'
      RetentionInDays: 14
  WeeklyErrors:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Falhas da funcao Weekly
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref Weekly
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref Notifications]
  StreamAge:
    Type: AWS::CloudWatch::Alarm
    Properties:
      Namespace: AWS/Lambda
      MetricName: IteratorAge
      Dimensions:
        - Name: FunctionName
          Value: !Ref Critical
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 300000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref Notifications]
Outputs:
  Endpoint:
    Value: !Sub 'https://${Api}.execute-api.${AWS::Region}.${AWS::URLSuffix}/v1/avaliacao'
  TopicArn:
    Value: !Ref Notifications
